name: Dependency audit

# Fails on any known high or critical advisory in a runtime dependency of either
# package (dev-only advisories are reported, not blocking; see the steps below). Runs on
# every PR and push like the tests do, and weekly: an advisory published after
# the last merge should turn this red without waiting for the next PR.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 5 * * 1'

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, backend]
        include:
          - package: frontend
            directory: .
          - package: backend
            directory: backend
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What ships: runtime dependencies only. This is the gate. A high advisory
      # here is something the running application is exposed to.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --package-lock-only --audit-level=high
      # Everything, dev tooling included. Reported but not blocking: an advisory
      # in a dev-only package (nodemon, ESLint's glob chain) with no patched
      # release must not stop every pull request, and `braces` is exactly that
      # today (GHSA-vfj7-8cjw-p6xm, affects all versions). Read this step's
      # output; Dependabot opens the update when a fix exists.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: npm audit --package-lock-only --audit-level=high
