# Reverse proxy for VendorConnect: Next.js (3000) + Express/Socket.io API (5000)
# behind one TLS-terminated domain. Copy to /etc/nginx/sites-available/vendorconnect,
# symlink into sites-enabled, run `certbot --nginx -d your.domain.com` to fill in TLS.
#
# Per-client subdomains: every workspace is <slug>.your.domain.com, so this server
# answers to the wildcard, and the certificate must be a wildcard one
# (`certbot certonly --manual --preferred-challenges dns -d your.domain.com
# -d '*.your.domain.com'`, or a DNS-plugin for automatic renewal), with a wildcard
# DNS record (*.your.domain.com) pointing here. Set PORTAL_BASE_DOMAIN=your.domain.com
# in backend/.env.

# Per-IP ceiling on the endpoints that establish or take over an identity. It is
# an abuse limit, not the real control: an office behind one NAT address shares
# it, so it is deliberately generous (30/min sustained, 30 more in a burst). The
# control that matters is per account, in the API (middleware/accountGuard.js).
# Kept off /api/auth/me and the rest of /api so ordinary page loads never count.
limit_req_zone $binary_remote_addr zone=vc_auth:10m rate=30r/m;

upstream vendorconnect_web {
    server 127.0.0.1:3000;
}

upstream vendorconnect_api {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name your.domain.com *.your.domain.com;
    server_tokens off; # no nginx version in Server headers or error pages
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your.domain.com *.your.domain.com;
    server_tokens off;

    # ssl_certificate / ssl_certificate_key are inserted here by certbot

    client_max_body_size 15m; # headroom above MAX_FILE_SIZE_MB for vendor document uploads

    # Sign-in, self-registration and password recovery. A regex location (so
    # proxy_pass carries no URI); a match here wins over the /api/ prefix below.
    location ~ ^/api/(platform/)?auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=vc_auth burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://vendorconnect_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        proxy_pass http://vendorconnect_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host; # overwrite: a client-supplied one must not name a workspace
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io - needs the Upgrade/Connection headers and a long read timeout,
    # or connections silently drop after nginx's default 60s.
    location /socket.io/ {
        proxy_pass http://vendorconnect_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host; # overwrite: a client-supplied one must not name a workspace
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://vendorconnect_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host; # overwrite: a client-supplied one must not name a workspace
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
