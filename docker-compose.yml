services:
  postgres:
    image: postgres:16-alpine
    container_name: sap_vendor_portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sap_portal
      POSTGRES_PASSWORD: sap_portal_dev
      POSTGRES_DB: sap_vendor_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
